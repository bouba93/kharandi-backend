<a href="{{ link }}"
   class="rounded-xl bg-white p-5 shadow-sm ring-1 ring-gray-950/5 transition hover:-translate-y-0.5 hover:shadow-md dark:bg-gray-900 dark:ring-white/10">

    <div class="flex items-center justify-between">

        <span class="text-sm font-medium text-gray-500 dark:text-gray-400">
            {{ title }}
        </span>

        <span class="material-symbols-outlined text-primary-600">
            {{ icon }}
        </span>

    </div>

    <div class="mt-3 text-3xl font-semibold text-gray-900 dark:text-white">
        {{ value }}
    </div>

</a>
