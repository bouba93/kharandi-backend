<a href="{{ link }}"
   class="group relative overflow-hidden rounded-2xl bg-white p-5 shadow-sm ring-1 ring-gray-950/5 transition duration-200 hover:-translate-y-1 hover:shadow-lg dark:bg-gray-900 dark:ring-white/10">

    <div class="absolute inset-x-0 top-0 h-1 {{ color }}"></div>

    <div class="flex items-center justify-between">

        <span class="text-sm font-semibold text-gray-600 dark:text-gray-300">
            {{ title }}
        </span>

        <span class="material-symbols-outlined rounded-xl p-2 {{ icon_bg }} {{ icon_color }}">
            {{ icon }}
        </span>

    </div>

    <div class="mt-4 text-3xl font-bold text-gray-950 dark:text-white">
        {{ value }}
    </div>

    <div class="mt-2 text-xs text-gray-500 dark:text-gray-400">
        Voir les détails →
    </div>

</a>
