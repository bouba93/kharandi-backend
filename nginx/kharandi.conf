# ──────────────────────────────────────────────────────────────────────────────
# Kharandi API — Nginx (VPS YIGUI · 212.95.33.158)
# Monté sur : /etc/nginx/conf.d/default.conf
#
# Configuration PAR DÉFAUT : HTTP seul, accessible directement par l'IP.
# Elle démarre sans certificat SSL → aucun crash au premier boot.
#
# Le frontend reste hébergé sur Vercel (kharandi.gn). Ce fichier ne sert QUE
# le backend. Aucun DNS n'est requis pour que l'API réponde sur l'IP.
#
# Pour activer HTTPS plus tard (après avoir pointé un sous-domaine dédié —
# ex. api.kharandi.gn — vers 212.95.33.158, SANS toucher au DNS de Vercel) :
#   bash deploy/enable-ssl.sh api.kharandi.gn admin@kharandi.gn
#
# ┌ POINTS CLÉS DE LA CORRECTION ───────────────────────────────────────────┐
# │ 1. Toutes les locations proxy incluent `snippets/proxy_params.conf`     │
# │    qui force `Host $host`. Sans ça Nginx envoyait `Host: kharandi_api`  │
# │    (= $proxy_host) → Django répondait 400 DisallowedHost.               │
# │ 2. `resolver 127.0.0.11` + upstream dans une VARIABLE : Nginx           │
# │    re-résout `api` toutes les 10 s. Plus de 502 figé quand le conteneur │
# │    API est recréé (`up -d --build`) ou après reboot du VPS.             │
# │ 3. Un `default_server` distinct renvoie 444 sur les Host inconnus :     │
# │    protection anti Host-spoofing sans recourir à ALLOWED_HOSTS = ["*"]. │
# │ 4. Le healthcheck du conteneur n'utilise PLUS ce fichier : il tape      │
# │    127.0.0.1:8081/nginx-health (voir nginx/health.conf).                │
# └─────────────────────────────────────────────────────────────────────────┘
# ──────────────────────────────────────────────────────────────────────────────


# ══════════════════════════════════════════════════════════════════════════════
# 1) Serveur par défaut — attrape tous les Host NON reconnus
#    Répond 444 (fermeture sans réponse) sauf pour le challenge ACME.
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 80 default_server;
    server_name _;

    access_log off;

    # Toujours laisser passer le challenge Certbot, quel que soit le Host.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 444;
    }
}


# ══════════════════════════════════════════════════════════════════════════════
# 2) Serveur applicatif Kharandi
#
#    ⚠️  Pour ajouter un domaine backend, l'ajouter ICI **et** dans
#        ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS du fichier .env.
#        Ne PAS ajouter kharandi.gn / www.kharandi.gn : ces domaines
#        appartiennent au frontend Vercel et ne pointent pas sur ce VPS.
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name 212.95.33.158
                api.kharandi.gn
                backend.kharandi.gn
                localhost
                127.0.0.1;

    # Résolveur DNS embarqué de Docker — indispensable pour que le nom `api`
    # soit ré-évalué à chaud (voir point 2 de l'entête).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    client_max_body_size 50M;
    charset utf-8;

    # Logs
    access_log /var/log/nginx/kharandi.access.log;
    error_log  /var/log/nginx/kharandi.error.log warn;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Challenge Certbot (prêt pour l'activation SSL)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ─── Fichiers statiques servis directement par Nginx ─────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    # ─── Sondes publiques ────────────────────────────────────────────────────
    # /nginx-health : répond même si Django est à terre (utile au diagnostic).
    location = /nginx-health {
        default_type text/plain;
        access_log off;
        return 200 "nginx ok\n";
    }

    # /healthz : liveness Django (pas d'accès base de données).
    location = /healthz {
        set $kharandi_api "api:8000";
        proxy_pass http://$kharandi_api/healthz;
        include /etc/nginx/snippets/proxy_params.conf;
        access_log off;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }

    # /readyz : readiness profonde (Django + PostgreSQL + Redis).
    location = /readyz {
        set $kharandi_api "api:8000";
        proxy_pass http://$kharandi_api/readyz;
        include /etc/nginx/snippets/proxy_params.conf;
        access_log off;
        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;
    }

    # ─── Flux SSE : Karamo (IA) + notifications temps réel ───────────────────
    location ~ ^/api/v1/(ai/ask/stream|notifications/stream)/ {
        set $kharandi_api "api:8000";
        proxy_pass http://$kharandi_api;
        include /etc/nginx/snippets/proxy_params.conf;
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ─── API Django ──────────────────────────────────────────────────────────
    location / {
        set $kharandi_api "api:8000";
        proxy_pass http://$kharandi_api;
        include /etc/nginx/snippets/proxy_params.conf;
    }
}
