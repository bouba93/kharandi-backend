# ──────────────────────────────────────────────────────────────────────────────
# Kharandi API — Nginx HTTPS (activé par deploy/enable-ssl.sh)
# api.kharandi.gn est remplacé automatiquement par le domaine backend fourni
# (ex. api.kharandi.gn). Le frontend Vercel (kharandi.gn) n'est PAS concerné.
#
# Les mêmes règles que la version HTTP s'appliquent :
#   • `Host $host` forcé partout via snippets/proxy_params.conf
#   • resolver Docker + upstream en variable (re-résolution à chaud)
#   • default_server 444 sur les Host inconnus
#   • le healthcheck du conteneur reste sur 127.0.0.1:8081 (nginx/health.conf)
# ──────────────────────────────────────────────────────────────────────────────


# ══════════════════════════════════════════════════════════════════════════════
# 1) Catch-all HTTP — Host inconnus
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 80 default_server;
    server_name _;
    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 444;
    }
}


# ══════════════════════════════════════════════════════════════════════════════
# 2) HTTP — challenge Certbot + redirection HTTPS
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name api.kharandi.gn 212.95.33.158 localhost 127.0.0.1;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Sondes accessibles en clair : Docker/monitoring ne doivent pas dépendre
    # de la validité du certificat.
    location = /nginx-health {
        default_type text/plain;
        access_log off;
        return 200 "nginx ok\n";
    }

    location = /healthz {
        set $kharandi_api "api:8000";
        proxy_pass http://$kharandi_api/healthz;
        include /etc/nginx/snippets/proxy_params.conf;
        access_log off;
        proxy_read_timeout    5s;
    }

    # ── Callback de paiement LengoPay ────────────────────────────────────────
    # EXCEPTION VOLONTAIRE À LA REDIRECTION HTTPS.
    # LengoPay notifie en POST sur l'URL enregistrée côté marchand. Une
    # redirection 301 ferait perdre le corps de la requête (la plupart des
    # clients HTTP ne rejouent pas un POST après redirection) : la confirmation
    # de paiement serait définitivement perdue.
    # Tant que l'URL de callback enregistrée chez LengoPay pointe en HTTP sur
    # l'IP, cette location doit rester. Elle pourra être supprimée après
    # bascule de LENGOPAY_PUBLIC_BASE_URL vers https://api.kharandi.gn ET mise à
    # jour de l'URL de callback côté LengoPay.
    location ^~ /api/v1/payments/webhook {
        set $kharandi_api "api:8000";
        proxy_pass http://$kharandi_api;
        include /etc/nginx/snippets/proxy_params.conf;
        proxy_read_timeout    30s;
    }

    location / {
        return 301 https://api.kharandi.gn$request_uri;
    }
}


# ══════════════════════════════════════════════════════════════════════════════
# 3) HTTPS — service applicatif
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    http2 on;
    server_name api.kharandi.gn;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    ssl_certificate     /etc/letsencrypt/live/api.kharandi.gn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kharandi.gn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50M;
    charset utf-8;

    access_log /var/log/nginx/kharandi.access.log;
    error_log  /var/log/nginx/kharandi.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ⚠️ SANS CE BLOC, LES PIÈCES D'IDENTITÉ KYC SERAIENT PUBLIQUES.
    # Les documents KYC des répétiteurs sont stockés dans /app/media/private/
    # (volume media_data, déjà sauvegardé). Ce répertoire ne doit JAMAIS être
    # servi en statique : la seule lecture autorisée passe par la vue admin
    # authentifiée /admin/users/tutorkyc/<id>/document/<champ>/.
    # `^~` donne la priorité à ce bloc sur le préfixe /media/ ci-dessous.
    location ^~ /media/private/ {
        deny all;
        return 404;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    location = /nginx-health {
        default_type text/plain;
        access_log off;
        return 200 "nginx ok\n";
    }

    location = /healthz {
        set $kharandi_api "api:8000";
        proxy_pass http://$kharandi_api/healthz;
        include /etc/nginx/snippets/proxy_params.conf;
        access_log off;
        proxy_read_timeout    5s;
    }

    location = /readyz {
        set $kharandi_api "api:8000";
        proxy_pass http://$kharandi_api/readyz;
        include /etc/nginx/snippets/proxy_params.conf;
        access_log off;
        proxy_read_timeout    10s;
    }


    # ──────────────────────────────────────────────────────────────────────────
    # Erreurs générées par NGINX lui-même (api injoignable, délai dépassé,
    # corps trop volumineux). Sans ces blocs, Nginx renvoie sa page HTML par
    # défaut et le frontend échoue sur « Expected JSON, got HTML ».
    # `proxy_intercept_errors` reste à off : les erreurs produites par Django
    # (déjà en JSON) traversent Nginx sans être réécrites.
    # ──────────────────────────────────────────────────────────────────────────
    location @erreur_api_json {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"success":false,"message":"Service API temporairement indisponible.","error":"Service API temporairement indisponible.","errors":null,"details":null,"status":503,"source":"nginx"}';
    }

    location @erreur_sse {
        internal;
        default_type text/event-stream;
        add_header Cache-Control "no-cache" always;
        add_header X-Accel-Buffering "no" always;
        return 200 'data: {"type":"error","code":"indisponible","message":"Service API temporairement indisponible.","source":"nginx"}\n\n';
    }

    # Flux SSE : Karamo (IA) + notifications
    location ~ ^/api/v1/(ai/ask/stream|notifications/stream)/ {
        set $kharandi_api "api:8000";
        proxy_pass http://$kharandi_api;
        include /etc/nginx/snippets/proxy_params.conf;
        proxy_buffering    off;
        proxy_cache        off;
        # chunked_transfer_encoding laissé ACTIVÉ : en HTTP/1.1 il est le seul
        # moyen de délimiter les évènements d'un flux SSE sans fermer la
        # connexion. Le désactiver faisait attendre certains clients.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        error_page 500 502 503 504 = @erreur_sse;
    }

    location / {
        set $kharandi_api "api:8000";
        proxy_pass http://$kharandi_api;
        include /etc/nginx/snippets/proxy_params.conf;
        error_page 500 502 503 504 = @erreur_api_json;
        error_page 413 = @erreur_api_json;
    }
}
