# ──────────────────────────────────────────────────────────────────────────────
# Kharandi — En-têtes communs de reverse proxy (inclus par toutes les locations)
#
# IMPORTANT : `Host $host` est OBLIGATOIRE sur CHAQUE location qui fait un
# proxy_pass. Sans lui, Nginx envoie par défaut `Host: $proxy_host`
# (c.-à-d. le nom de l'upstream, ex. « kharandi_api »), que Django rejette
# avec un 400 DisallowedHost car il n'est pas dans ALLOWED_HOSTS.
# C'était la cause racine du HTTP 400 sur /healthz.
# ──────────────────────────────────────────────────────────────────────────────

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_set_header Connection        "";

# Les clients ne doivent jamais pouvoir injecter ces en-têtes eux-mêmes :
# les `proxy_set_header` ci-dessus les écrasent systématiquement.

proxy_redirect off;
proxy_connect_timeout 10s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;
