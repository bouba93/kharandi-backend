# ──────────────────────────────────────────────────────────────────────────────
# Kharandi — Écouteur de santé INTERNE au conteneur Nginx
#
# Monté sur : /etc/nginx/conf.d/00-health.conf
#
# Pourquoi un listener séparé sur 127.0.0.1:8081 ?
#   1. Il n'est PAS publié sur Internet (aucun `ports:` sur 8081) : la sonde
#      reste strictement interne au conteneur.
#   2. Il ne dépend d'AUCUN `server_name` / Host : le healthcheck Docker ne
#      peut donc plus être cassé par un durcissement de ALLOWED_HOSTS ou par
#      un changement de domaine.
#   3. Il survit au basculement HTTP → HTTPS (`deploy/enable-ssl.sh` ne
#      réécrit que `default.conf`, jamais ce fichier).
#
# Deux sondes distinctes :
#   /nginx-health     → LIVENESS  : « le process Nginx répond-il ? »  (200 pur)
#   /api-health       → READINESS : « Nginx joint-il Django ? »       (proxy)
#
# Le healthcheck Docker du conteneur nginx utilise /nginx-health UNIQUEMENT.
# Voir la justification détaillée dans DEPLOIEMENT_FIX.md.
# ──────────────────────────────────────────────────────────────────────────────

server {
    listen      127.0.0.1:8081;
    server_name _;

    # Résolveur DNS interne de Docker : permet de re-résoudre `api` à chaud
    # lorsque le conteneur API est recréé et change d'adresse IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    access_log off;
    error_log  /var/log/nginx/health.error.log warn;

    # ─── Liveness Nginx : ne dépend de rien d'autre que Nginx lui-même ────────
    location = /nginx-health {
        default_type text/plain;
        return 200 "nginx ok\n";
    }

    # ─── Readiness applicative : Nginx → Django ──────────────────────────────
    # Utilisée pour le diagnostic et le monitoring externe, PAS par le
    # healthcheck du conteneur (pour éviter les faux « unhealthy » en cascade).
    # NB : on écrit les en-têtes explicitement au lieu d'inclure
    # snippets/proxy_params.conf. Inclure le snippet PUIS redéfinir `Host`
    # au même niveau enverrait DEUX en-têtes Host à Django (→ 400).
    location = /api-health {
        set $kharandi_api "api:8000";
        proxy_pass http://$kharandi_api/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host              "127.0.0.1";
        proxy_set_header Connection        "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto "http";
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }

    # ─── Readiness profonde : Django + PostgreSQL + Redis ────────────────────
    location = /api-ready {
        set $kharandi_api "api:8000";
        proxy_pass http://$kharandi_api/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host              "127.0.0.1";
        proxy_set_header Connection        "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto "http";
        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;
    }

    location / {
        return 404;
    }
}
